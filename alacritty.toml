[general]
import = [
"~/.config/alacritty/themes/noctalia.toml"
]

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 10

[window]
decorations = "None"
padding = { x = 6, y = 6 }
opacity = 0.8

[scrolling]
history = 3023

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500
unfocused_hollow = true
smooth_motion = true
smooth_motion_spring = 1.0
smooth_motion_factor = 0.85
smooth_motion_max_stretch_x = 1.0
smooth_motion_max_stretch_y = 1.0

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Equals"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\n"
