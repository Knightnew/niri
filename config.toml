# Core Infrastructure
allowlist = [
    "^127\\.0\\.0\\.1$",
    "^ap\\.spotify\\.com$",
    "^apresolve\\.spotify\\.com$",
    "^api\\.spotify\\.com$",
    "^api-partner\\.spotify\\.com$",
    "^clienttoken\\.spotify\\.com$",
    "^xpui\\.app\\.spotify\\.com$",

    # Access Point Server Clusters (Critical for network handshakes)
    ".*ap-guc3\\.spotify\\.com$",
    ".*ap-gae2\\.spotify\\.com$",
    ".*ap-gew1\\.spotify\\.com$",
    ".*ap-gew4\\.spotify\\.com$",

    # Sync & History (Allows Recently Played to update cleanly)
    "^spclient\\.wg\\.spotify\\.com$",
    "https://spclient\\.wg\\.spotify\\.com/gabo-receiver-service/.*",
    ".*dealer.*\\.spotify\\.com$",
    "^analytics\\.spotify\\.com$",
    "^log\\.spotify\\.com$",

    # Media Content & Images
    ".*\\.pscdn\\.co$",
    ".*\\.scdn\\.co$",
    ".*\\.spotifycdn\\.com$",
    ".*\\.spotifycdn\\.net$",

    # Widevine / DRM
    ".*\\.gvt.*\\.com$",

    # Discovery (Allows local network device sync)
    "^239\\.255\\.255\\.250$",
    "^mdns\\.mcast\\.net$"
]

# Targeted Ad & Logic Blocks
denylist = [
    "https://.*-spclient\\.spotify\\.com/ads/.*",
    "https://.*-spclient\\.spotify\\.com/ad-logic/.*",
    "https://spclient\\.wg\\.spotify\\.com/ads/.*",
    "https://spclient\\.wg\\.spotify\\.com/ad-logic/.*"
]
